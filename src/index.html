<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vine Monitor Log</title>
    <style>
        body {
            font-family: Consolas, monospace;
            background: #1e1e1e;
            color: #dcdcdc;
            margin: 0;
            padding: 0;
        }

        #header {
            background: #333;
            padding: 10px 20px;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
        }

        #controls {
            display: flex;
            gap: 10px;
        }

        button {
            background: #444;
            color: #fff;
            border: none;
            padding: 6px 12px;
            cursor: pointer;
        }
        button:hover {
            background: #555;
        }

        #search {
            padding: 6px;
            border: none;
            outline: none;
            background: #2b2b2b;
            color: #fff;
        }

        #log {
            white-space: pre-wrap;
            padding: 20px;
            overflow-y: scroll;
            height: calc(100vh - 60px);
            margin-top: 60px;
        }

        .info { color: #4aa3ff; }
        .warning { color: #ffcc00; }
        .error { color: #ff6666; }

        .new-item-line { color: #66ff99; font-weight: bold; }
        .priority-line { color: #ff66ff; font-weight: bold; padding-left: 20px; }
        .checking-line { color: #66aaff; font-weight: bold; }
        .found-line { color: #ffaa66; font-weight: bold; }
        .error-line { color: #ff4444; font-weight: bold; }

        .bullet::before {
            content: " • ";
            color: #888;
        }

        .normal-line { display: inline; }

        a { text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div id="header">
    <div>Vine Monitor Log</div>
    <div id="controls">
        <input id="search" type="text" placeholder="Filter...">
        <button id="highlightsOnly">Highlights Only</button>
        <button id="pause">Pause</button>
        <button id="refresh">Refresh</button>
    </div>
</div>

<pre id="log">Loading...</pre>

<script>
    let autoRefresh = true;
    let refreshTimer = null;
    let highlightsOnly = false;

    // 🔧 EASY-ACCESS CONSTANT FOR LINK SEARCH LENGTH
    const LINK_SEARCH_LENGTH = 20;

    const logBox = document.getElementById("log");
    const searchBox = document.getElementById("search");

	function buildVineSearchLink(text) {
		let trimmed = text.substring(0, LINK_SEARCH_LENGTH).trim();

		// Ensure we don't cut off the last word
		if (trimmed.includes(" ")) {
			trimmed = trimmed.substring(0, trimmed.lastIndexOf(" ")).trim();
    }

    const encoded = encodeURIComponent(trimmed);
    return `https://www.amazon.com/vine/vine-items?search=${encoded}`;
}
    function applyColorCoding(line) {
        const original = line;

        const isNoLine = /^\s*No\b/i.test(original);

        const isNewItem =
            !isNoLine &&
            /\bNew\b.*\bItem(s)?\b/i.test(original);

        const isPriority = original.includes("Priority match");

        const isChecking = original.includes("Checking");

        const isFound =
            /\bFound\b.*\bItem(s)?\b/i.test(original);

        const isErrorLine = original.includes("ERROR");

        const isCritical = original.includes("CRITICAL");

        if (highlightsOnly &&
            !isNewItem &&
            !isPriority &&
            !isFound &&
            !isErrorLine &&
            !isNoLine &&
            !isCritical) {
            return null;
        }

        if (isNewItem || isPriority || isFound || isErrorLine || isNoLine || isCritical) {
            line = line.replace(/^\s*\d{2}:\d{2}:\d{2},\d{3}\s*-\s*-\s*/g, "");
            line = line.replace(/^\s*\d{4}-\d{2}-\d{2}.*?\s-\s*/g, "");
            line = line.replace(/\b(INFO|WARNING|ERROR|CRITICAL)\b/g, "");
            line = line.replace(/^\s*[-:]+\s*/, "");
            line = line.replace(/New .* Item(s)?:\s*/i, "");
        }

        line = line.replace(/INFO/g, '<span class="info">INFO</span>');
        line = line.replace(/WARNING/g, '<span class="warning">WARNING</span>');
        line = line.replace(/ERROR/g, '<span class="error">ERROR</span>');
        line = line.replace(/CRITICAL/g, '<span class="error">CRITICAL</span>');

        if (isNoLine) {
            return `<span class="error-line normal-line">${line}</span>`;
        }

        if (isNewItem) {
            const url = buildVineSearchLink(line);
            return `<a href="${url}" target="_blank" class="new-item-line bullet">${line}</a>`;
        }

        if (isPriority) {
            return `<span class="priority-line bullet">${line}</span>`;
        }

        if (isChecking) {
            return `<span class="checking-line normal-line">${line}</span>`;
        }

        if (isFound) {
            return `<span class="found-line normal-line">${line}</span>`;
        }

        if (isErrorLine) {
            return `<span class="error-line normal-line">${line}</span>`;
        }

        if (isCritical) {
            return `<span class="error-line normal-line">${line}</span>`;
        }

        return `<span class="normal-line">${line}</span>`;
    }

    function filterLines(lines) {
        const query = searchBox.value.toLowerCase();
        if (!query) return lines;
        return lines.filter(line => line.toLowerCase().includes(query));
    }

    async function loadLog() {
        try {
            const response = await fetch("/log");
            if (!response.ok) {
                logBox.textContent = "Error loading log: " + response.statusText;
                return;
            }

            const text = await response.text();
            let lines = text.split("\n");

            lines = filterLines(lines);

            const processed = lines
                .map(applyColorCoding)
                .filter(l => l !== null)
                .join("\n");

            logBox.innerHTML = processed;
            logBox.scrollTop = logBox.scrollHeight;

        } catch (err) {
            logBox.textContent = "Error fetching log: " + err;
        }
    }

    function startAutoRefresh() {
        if (refreshTimer) clearInterval(refreshTimer);
        refreshTimer = setInterval(loadLog, 3000);
    }

    document.getElementById("refresh").onclick = loadLog;

    document.getElementById("pause").onclick = () => {
        autoRefresh = !autoRefresh;
        const btn = document.getElementById("pause");

        if (autoRefresh) {
            btn.textContent = "Pause";
            startAutoRefresh();
        } else {
            btn.textContent = "Resume";
            clearInterval(refreshTimer);
        }
    };

    document.getElementById("highlightsOnly").onclick = () => {
        highlightsOnly = !highlightsOnly;
        document.getElementById("highlightsOnly").textContent =
            highlightsOnly ? "Show All" : "Highlights Only";
        loadLog();
    };

    searchBox.oninput = loadLog;

    loadLog();
    startAutoRefresh();
</script>

</body>
</html>

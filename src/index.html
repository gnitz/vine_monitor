<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vine Monitor Log</title>
    <style>
        body {
            font-family: Consolas, monospace;
            background: #1e1e1e;
            color: #dcdcdc;
            margin: 0;
            padding: 0;
        }

        #header {
            background: #333;
            padding: 10px 20px;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
        }

        #controls {
            display: flex;
            gap: 10px;
        }

        button {
            background: #444;
            color: #fff;
            border: none;
            padding: 6px 12px;
            cursor: pointer;
        }
        button:hover {
            background: #555;
        }

        #searchWrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        #searchWrapper input {
            padding-right: 22px;
        }

        #clearSearch {
            position: absolute;
            right: 6px;
            cursor: pointer;
            color: #aaa;
            font-size: 16px;
            user-select: none;
        }

        #clearSearch:hover {
            color: #fff;
        }

        #search {
            padding: 6px;
            border: none;
            outline: none;
            background: #2b2b2b;
            color: #fff;
        }

        #log {
            white-space: pre-wrap;
            padding: 20px;
            overflow-y: scroll;
            height: calc(100vh - 60px);
            margin-top: 60px;
        }

        .info { color: #4aa3ff; }
        .warning { color: #ffcc00; }
        .error { color: #ff6666; }

        .new-item-line { color: #66ff99; font-weight: bold; }
        .priority-line { color: #ff66ff; font-weight: bold; padding-left: 20px; }
        .checking-line { color: #66aaff; font-weight: bold; }
        .found-line { color: #ffaa66; font-weight: bold; }
        .error-line { color: #ff4444; font-weight: bold; }

        .bullet::before {
            content: " • ";
            color: #888;
        }

        .normal-line { display: inline; }

        a { text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div id="header">
    <div>Vine Monitor Log</div>
    <div id="controls">
		<label style="display:flex;align-items:center;gap:5px;color:#fff;">
			<input type="checkbox" id="notifyPriority">
		Priority Notifications
		</label>
        <div id="searchWrapper">
            <input id="search" type="text" placeholder="Filter...">
            <span id="clearSearch">✕</span>
        </div>
        <button id="highlightsOnly">Highlights Only</button>
        <button id="priorityOnly">Priority Only</button>
        <button id="pause">Pause</button>
        <button id="refresh">Refresh</button>
    </div>
</div>

<pre id="log">Loading...</pre>

<script>
    let autoRefresh = true;
    let refreshTimer = null;
    let highlightsOnly = false;
    let priorityOnly = false;
	let seenPriorityItems = new Set();

    const LINK_SEARCH_LENGTH = 20;

    const logBox = document.getElementById("log");
    const searchBox = document.getElementById("search");

	function showToast(message) {
		const toast = document.getElementById("toast");
		toast.textContent = message;
		toast.style.display = "block";

		setTimeout(() => {
			toast.style.display = "none";
		}, 4000);
	}

    function buildVineSearchLink(text) {
        // Remove "New ... Item:" prefix
        let cleaned = text.replace(/^New\b.*?\bItem(s)?:\s*/i, "").trim();

        let trimmed = cleaned.substring(0, LINK_SEARCH_LENGTH).trim();
        if (trimmed.includes(" ")) {
            trimmed = trimmed.substring(0, trimmed.lastIndexOf(" ")).trim();
        }
        return "https://www.amazon.com/vine/vine-items?search=" + encodeURIComponent(trimmed);
    }

    // Used ONLY for detection
    function stripPrefixes(line) {
        return line
            .replace(/^\s*\d{2}:\d{2}:\d{2},\d{3}\s*-\s*-\s*/, "")
            .replace(/^\s*\d{4}-\d{2}-\d{2}.*?\s-\s*/, "")
            .replace(/\b(INFO|WARNING|ERROR|CRITICAL)\b/g, "")
            .replace(/^\s*[-:]+\s*/, "")
            .trim();
    }

    function applyColorCoding(line) {
        const original = line;      
        const stripped = stripPrefixes(line);

        // DETECTION
        const isNoLine = /^No\b/i.test(stripped);
        const isNewItem = /^New\b.*\bItem(s)?\b/i.test(stripped);
        const isPriority = /^Priority match\b/i.test(stripped);
        const isChecking = /^Checking\b/i.test(stripped);
        const isFound = /^Found\b/i.test(stripped) && !stripped.includes("(Page");
        const isErrorLine = stripped.includes("ERROR");
        const isCritical = stripped.includes("CRITICAL");
		// Detect new priority items for notifications
		if (isPriority) {
			const key = stripped; // stripped contains the clean text

			if (!seenPriorityItems.has(key)) {
				seenPriorityItems.add(key);

				// Only notify if checkbox is enabled
				if (document.getElementById("notifyPriority").checked) {
					showToast("New Priority Item Found!");
				}
			}
		}
        // PRIORITY-ONLY FILTER
        if (priorityOnly && !isPriority) {
            return null;
        }

        // HIGHLIGHTS-ONLY FILTER
        if (highlightsOnly &&
            !isNewItem &&
            !isPriority &&
            !isFound &&
            !isErrorLine &&
            !isNoLine &&
            !isCritical) {
            return null;
        }

        // RENDERING TEXT
        let renderText = highlightsOnly ? stripped : original;

        // COLOR TAGS
        renderText = renderText.replace(/INFO/g, '<span class="info">INFO</span>');
        renderText = renderText.replace(/WARNING/g, '<span class="warning">WARNING</span>');
        renderText = renderText.replace(/ERROR/g, '<span class="error">ERROR</span>');
        renderText = renderText.replace(/CRITICAL/g, '<span class="error">CRITICAL</span>');

        // RENDERING RULES
        if (isNoLine) {
            return `<span class="error-line normal-line">${renderText}</span>`;
        }

        if (isNewItem) {
            const url = buildVineSearchLink(stripped);
            return `<a href="${url}" target="_blank" class="new-item-line bullet">${renderText}</a>`;
        }

        if (isPriority) {
            return `<span class="priority-line bullet">${renderText}</span>`;
        }

        if (isChecking) {
            return `<span class="checking-line normal-line">${renderText}</span>`;
        }

        if (isFound) {
            return `<span class="found-line normal-line">${renderText}</span>`;
        }

        if (isErrorLine) {
            return `<span class="error-line normal-line">${renderText}</span>`;
        }

        if (isCritical) {
            return `<span class="error-line normal-line">${renderText}</span>`;
        }

        return `<span class="normal-line">${renderText}</span>`;
    }

    function filterLines(lines) {
        const query = searchBox.value.toLowerCase();
        if (!query) return lines;
        return lines.filter(line => line.toLowerCase().includes(query));
    }

    async function loadLog() {
        try {
            const response = await fetch("/log");
            if (!response.ok) {
                logBox.textContent = "Error loading log: " + response.statusText;
                return;
            }

            const text = await response.text();
            let lines = text.split("\n");

            lines = filterLines(lines);

            const processed = lines
                .map(applyColorCoding)
                .filter(l => l !== null)
                .join("\n");

            logBox.innerHTML = processed;
            logBox.scrollTop = logBox.scrollHeight;

        } catch (err) {
            logBox.textContent = "Error fetching log: " + err;
        }
    }

    function startAutoRefresh() {
        if (refreshTimer) clearInterval(refreshTimer);
        refreshTimer = setInterval(loadLog, 3000);
    }

    document.getElementById("refresh").onclick = loadLog;

    document.getElementById("pause").onclick = () => {
        autoRefresh = !autoRefresh;
        const btn = document.getElementById("pause");

        if (autoRefresh) {
            btn.textContent = "Pause";
            startAutoRefresh();
        } else {
            btn.textContent = "Resume";
            clearInterval(refreshTimer);
        }
    };

    document.getElementById("highlightsOnly").onclick = () => {
        highlightsOnly = !highlightsOnly;

        if (highlightsOnly) {
            priorityOnly = false;
            document.getElementById("priorityOnly").textContent = "Priority Only";
        }

        document.getElementById("highlightsOnly").textContent =
            highlightsOnly ? "Show All" : "Highlights Only";

        loadLog();
    };

    document.getElementById("priorityOnly").onclick = () => {
        priorityOnly = !priorityOnly;

        if (priorityOnly) {
            highlightsOnly = false;
            document.getElementById("highlightsOnly").textContent = "Highlights Only";
        }

        document.getElementById("priorityOnly").textContent =
            priorityOnly ? "Show All" : "Priority Only";

        loadLog();
    };

    searchBox.oninput = loadLog;

    document.getElementById("clearSearch").onclick = () => {
        searchBox.value = "";
        loadLog();
    };

    loadLog();
    startAutoRefresh();
</script>
<div id="toast" 
     style="position:fixed;bottom:20px;right:20px;
            background:#ff66ff;color:#000;padding:12px 18px;
            border-radius:6px;font-weight:bold;
            display:none;z-index:9999;">
</div>
</body>
</html>
